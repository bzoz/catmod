name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        continue-on-error: true
        run: chmod +x gradlew && ./gradlew build --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Class signatures (porting aid)
        if: always()
        run: >
          bash ci/diag.sh Player Avatar LivingEntity Entity WalkAnimationState
          EntityRenderDispatcher Creeper Cat TamableAnimal AvoidEntityGoal
          KeyMapping 'KeyMapping\$Category' KeyBindingHelper KeyMappingHelper
          PayloadTypeRegistry ServerPlayNetworking ClientPlayNetworking
          | grep -vE '^\s*$' > diag.log || true
      - name: Cat sound constants
        if: always()
        run: bash ci/diag.sh EntityType EntityTypes | grep -E '=====| CAT[;(]' > sounds.log || true
      - name: Push logs to ci-logs branch
        if: always()
        run: |
          mkdir /tmp/logs && cp build.log diag.log sounds.log /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs && git init -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "logs for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: catmod-jar
          path: build/libs/*.jar
      - name: Publish jar as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/catmod-*.jar | grep -v sources | head -1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$jar" \
            --title "Kot (Minecraft 26.2, Fabric)" \
            --notes "Drop this jar and Fabric API for 26.2 into the mods folder."
